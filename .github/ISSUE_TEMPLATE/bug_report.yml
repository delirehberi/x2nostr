name: '🐛 Bug Report'
description: 'Report an issue, CSV parsing failure, Nostr signing error, or UI glitch.'
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you are not uploading private keys or sensitive personal records.
  - type: dropdown
    id: component
    attributes:
      label: Affected Importer or Component
      description: Which part of x2nostr encountered an issue?
      options:
        - Goodreads Importer (Bookstr)
        - Movies Importer (IMDb / Letterboxd)
        - Blog Importer (NIP-23)
        - Nostr NIP-07 Login / Extension
        - Relay Broadcasting
        - Multilingual / i18n
        - UI / Layout
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Go to Goodreads importer
        2. Upload CSV with format ...
        3. Click 'Start Import'
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS, and NIP-07 Nostr extension used.
      placeholder: Chrome 130 on macOS / Alby Extension v3.5
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Activity Log
      description: Paste any error messages from the browser developer console or the on-screen activity log.
      render: shell
